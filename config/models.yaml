timeout_seconds: 8
daily_limit: 30
ip_daily_limit: 90
max_prompt_chars: 4000
max_response_chars: 8000
long_prompt_chars: 1500

models:
  gemini_flash:
    provider: gemini
    model: gemini-flash-latest
    label: Gemini Flash
  gemini_flash_lite:
    provider: gemini
    model: gemini-flash-lite-latest
    label: Gemini Flash-Lite
  openrouter_free:
    provider: openrouter
    model: openrouter/free
    label: Model miễn phí (OpenRouter)
  qwen_free:
    provider: openrouter
    model: qwen/qwen3.8-27b:free
    label: Qwen (free)

routes:
  code:      [gemini_flash, qwen_free, openrouter_free]
  math:      [gemini_flash, qwen_free, openrouter_free]
  translate: [gemini_flash, openrouter_free, qwen_free]
  long:      [gemini_flash, openrouter_free, qwen_free]
  quick:     [gemini_flash_lite, gemini_flash, openrouter_free]
  general:   [gemini_flash, openrouter_free, qwen_free]

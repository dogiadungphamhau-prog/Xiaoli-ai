<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C23B22">
<title>Xiaoli AI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="seal" aria-hidden="true">小</span><span class="word">Xiaoli AI</span></div>
  <div class="tools">
    <label class="sr" for="model">Chọn model</label>
    <select id="model"><option value="">Tự động chọn model</option></select>
    <button id="clear" type="button">Xóa lịch sử</button>
  </div>
</header>
<main id="chat" aria-live="polite"></main>
<footer>
  <p class="notice">Câu hỏi được gửi tới nhà cung cấp AI bên thứ ba. Không nhập thông tin nhạy cảm. <span id="quota"></span></p>
  <form id="form">
    <label class="sr" for="prompt">Câu hỏi của bạn</label>
    <textarea id="prompt" rows="1" placeholder="Nhập câu hỏi, Enter để gửi" maxlength="4000" required></textarea>
    <button id="send" type="submit">Gửi</button>
  </form>
</footer>
<script src="/app.js"></script>
</body>
</html>
